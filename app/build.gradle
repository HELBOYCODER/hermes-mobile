plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def hermesUrl = (project.findProperty('HERMES_URL')
        ?: System.getenv('HERMES_URL')
        ?: 'https://CHANGE-ME.example.com').toString().trim()
if (hermesUrl.isEmpty()) {
    hermesUrl = 'https://CHANGE-ME.example.com'
}

android {
    namespace 'com.ersaz.hermesmobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.ersaz.hermesmobile"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "HERMES_URL", "\"${hermesUrl}\""
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "debug.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
}
