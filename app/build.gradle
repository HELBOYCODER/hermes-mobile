plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Optional default for the remote Hermes WebUI tab; can be changed in Settings at runtime.
def hermesUrl = (project.findProperty('HERMES_URL')
        ?: System.getenv('HERMES_URL')
        ?: '').toString().trim()

android {
    namespace 'com.ersaz.hermesmobile'
    compileSdk 35
    ndkVersion "27.2.12479018"
    externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }

    defaultConfig {
        applicationId "com.ersaz.hermesmobile"
        minSdk 24
        targetSdk 35
        versionCode 260
        versionName "2.6.0"
        buildConfigField "String", "HERMES_URL", "\"${hermesUrl}\""
        // The sandbox (PRoot + Alpine) payload is aarch64 only.
        ndk { abiFilters 'arm64-v8a' }
    }
    testOptions { unitTests.includeAndroidResources = true }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        // proot + its loader ship as lib*.so and must be extracted to nativeLibraryDir,
        // the only place an Android 10+ app may exec() from.
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
    androidResources {
        // Keep the rootfs tarball as-is (already gzip'ed). It is named .bin because aapt
        // silently gunzips assets ending in .gz, which would break the lookup at runtime.
        noCompress += ['bin', 'tar.gz', 'gz']
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_PATH")
            storeFile ks ? file(ks) : file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

// Fail early with a clear message instead of shipping an APK whose terminal can't start.
tasks.register('checkSandboxPayload') {
    doLast {
        def jni = file('src/main/jniLibs/arm64-v8a')
        def rootfs = file('src/main/assets/sandbox/alpine-rootfs.bin')
        def missing = ['libproot.so', 'libproot-loader.so', 'libtalloc.so', 'libandroid-shmem.so']
                .findAll { !new File(jni, it).exists() }
        if (!rootfs.exists()) missing << 'assets/sandbox/alpine-rootfs.bin'
        if (!file('src/main/assets/sandbox/router-runtime.bin').exists()) missing << 'assets/sandbox/router-runtime.bin'
        if (!missing.isEmpty()) {
            throw new GradleException("Sandbox payload missing: ${missing}. Run ./scripts/fetch_sandbox.sh first.")
        }
    }
}
preBuild.dependsOn checkSandboxPayload

dependencies {
    implementation "androidx.browser:browser:1.8.0"
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Shizuku: lets the agent drive the phone (adb-level shell) once the user grants permission.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Real PTY terminal emulator (same widget Termux uses), driving our PRoot sandbox.
    implementation 'com.github.termux.termux-app:terminal-view:v0.118.1'
    implementation 'com.github.termux.termux-app:terminal-emulator:v0.118.1'

    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}
