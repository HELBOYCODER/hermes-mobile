name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sandbox payload (PRoot + Alpine rootfs)
        run: |
          pip install --quiet patchelf
          ./scripts/fetch_sandbox.sh
          ./scripts/bundle_prerequisites.sh

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            chmod 600 keystore.jks
            echo "keystore: release"
          else
            keytool -genkeypair -v -keystore keystore.jks -alias hermes \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Hermes Mobile, OU=Dev, O=Hermes, L=NA, S=NA, C=NA"
            echo "keystore: throwaway (secrets not configured)"
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=hermes
            KEY_PASSWORD=android
          fi
          {
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}"
            echo "KEY_ALIAS=${KEY_ALIAS:-hermes}"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          HERMES_URL: ${{ secrets.HERMES_URL }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PHERMES_URL="${HERMES_URL:-}"

      - name: Verify version and name APK
        run: |
          APP_VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          APP_VERSION_CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle)
          BADGING=$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk)
          grep -F "versionName='$APP_VERSION'" <<< "$BADGING"
          grep -F "versionCode='$APP_VERSION_CODE'" <<< "$BADGING"
          cp app/build/outputs/apk/release/app-release.apk "hermes-mobile-$APP_VERSION-arm64.apk"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hermes-mobile-${{ env.APP_VERSION }}-arm64
          path: hermes-mobile-${{ env.APP_VERSION }}-arm64.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Hermes Mobile ${{ env.APP_VERSION }}
          files: hermes-mobile-${{ env.APP_VERSION }}-arm64.apk
          body: |
            Immediate voice pause, resume into the existing draft, and send without waiting for the speech server.
            Bundled ARM64 Linux prerequisites and one-tap 9Router installation/repair.
            Includes the previously unmerged Bot Mode and UI changes.
            ARM64 only. Voice recognition and router package installation require internet.
