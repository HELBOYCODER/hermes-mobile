name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Never let two builds of the same ref race on one release / artifact (the 2.6.2 failure:
# four pushes within a minute all rewrote the v2.6.2 assets at once and one 404'd).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test bundled coding MCP
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Fetch sandbox payload (PRoot + Alpine rootfs)
        run: |
          pip install --quiet patchelf
          ./scripts/fetch_sandbox.sh
          ./scripts/bundle_prerequisites.sh

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            chmod 600 keystore.jks
            echo "keystore: release"
          else
            keytool -genkeypair -v -keystore keystore.jks -alias hermes \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Hermes Mobile, OU=Dev, O=Hermes, L=NA, S=NA, C=NA"
            echo "keystore: throwaway (secrets not configured)"
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=hermes
            KEY_PASSWORD=android
          fi
          {
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}"
            echo "KEY_ALIAS=${KEY_ALIAS:-hermes}"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          HERMES_URL: ${{ secrets.HERMES_URL }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PHERMES_URL="${HERMES_URL:-}"

      - name: Verify version and name APK
        run: |
          APP_VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          APP_VERSION_CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle)
          BADGING=$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk)
          grep -F "versionName='$APP_VERSION'" <<< "$BADGING"
          grep -F "versionCode='$APP_VERSION_CODE'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "hermes-mobile-$APP_VERSION-arm64.apk"
          sha256sum "hermes-mobile-$APP_VERSION-arm64.apk" > "hermes-mobile-$APP_VERSION-arm64.apk.sha256"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hermes-mobile-${{ env.APP_VERSION }}-arm64
          path: |
            hermes-mobile-${{ env.APP_VERSION }}-arm64.apk
            hermes-mobile-${{ env.APP_VERSION }}-arm64.apk.sha256

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      # Publish only from a version tag. Pushes to main build and upload the APK as an artifact but
      # no longer overwrite the assets of an already published release with a newer, untagged commit.
      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${APP_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${APP_VERSION} in app/build.gradle"
            exit 1
          fi
          NOTES="docs/releases/v${APP_VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing release notes $NOTES"
            exit 1
          fi
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Hermes Mobile ${{ env.APP_VERSION }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            hermes-mobile-${{ env.APP_VERSION }}-arm64.apk
            hermes-mobile-${{ env.APP_VERSION }}-arm64.apk.sha256
