name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10' }

      - run: gradle wrapper --gradle-version 8.10

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            chmod 600 keystore.jks
            echo "keystore: release"
          else
            keytool -genkeypair -v -keystore keystore.jks -alias hermes \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Hermes Mobile, OU=Dev, O=Hermes, L=NA, S=NA, C=NA"
            echo "keystore: throwaway (secrets not configured)"
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=hermes
            KEY_PASSWORD=android
          fi
          {
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}"
            echo "KEY_ALIAS=${KEY_ALIAS:-hermes}"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          HERMES_URL: ${{ secrets.HERMES_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PHERMES_URL="${HERMES_URL:-https://CHANGE-ME.example.com}"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-apk
          path: app/build/outputs/apk/release/app-release.apk

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: app/build/outputs/apk/release/app-release.apk }
