name: Marketing UI screenshots
on:
  pull_request:
    paths:
      - 'app/src/test/java/com/ersaz/hermesmobile/MarketingScreenshotTest.kt'
      - '.github/workflows/marketing-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Render actual release settings composables
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests com.ersaz.hermesmobile.MarketingScreenshotTest -x checkSandboxPayload
      - name: Save rendered UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ui-screenshots
          path: |
            app/build/marketing-screenshots/*.png
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
